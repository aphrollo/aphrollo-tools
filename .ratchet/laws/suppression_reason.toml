name        = "suppression_reason"
description = "Go has no #[allow]/#[expect]/#[ignore] pragma, so the vocabulary this law scans for is the one Go suppressions actually use: any line naming a nolint directive — a real //nolint:linter, the spaced // nolint form, or the token written in prose ABOUT that vocabulary. It reads the same view the detector that recognizes those directives reads (internal/tdd/smell/suppress.go's directives view, spelled here as `mask_strings`): string-literal CONTENTS blanked, comments preserved. A directive only suppresses anything where a linter reads it, which is a comment; the same token inside a quoted string is DATA — a fixture payload, a regex source, a test's expected text — and it silences nothing, so it owes nobody an explanation. Judging those lines unmasked bought exactly one thing: a `reason:` annotation on every line of test data that spells the word, answering a law about a suppression that was never there. Every line the masked view still names must carry a `reason:` explanation on its own line or in the contiguous comment run around it — above or below, since a wrapped doc comment often finishes its sentence on the next line. The bar is zero: nothing here is grandfathered, because every occurrence left is either a real suppression the anti-cheat gate must catch, or prose about that vocabulary, and either way a reader should not have to guess why the word is on that line."
severity    = "deny"
mask_strings = true

[scope]
include = ["cmd/**/*.go", "internal/**/*.go"]
exclude = ["**/testdata/**", ".ratchet/**"]
min_files = 429

[matcher]
kind      = "marker-within-lines"
trigger   = "nolint"
marker    = "reason\\s*:"
direction = "both"
contiguous = true
