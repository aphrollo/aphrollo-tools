name        = "co_change_twins"
description = "A function or file marked `// twin: <path>[#<func>]` directly above it must change in the SAME commit as its named twin — #316's rule for independently duplicated logic that drifts one commit at a time with nothing to notice. This repo's own seeded pairs: internal/tdd/lawgate/baselineguard.go naming internal/cli/ratchet.go#lawChangedSinceHEAD, internal/tdd/lock/buildlock_windows.go/buildlock_unix.go, internal/tdd/deferred_windows.go/deferred_unix.go, internal/tdd/lawgate/ratchetgate.go's own ratchetCheckErrorResult marking ratchetFixtureStage, and internal/tdd/statusline.go's greenLoggedSince marking lastRunQueued. Escaped by `// twin-diverges-ok: <why>` on the marker line or the comment run beside it."
severity    = "deny"

[scope]
changed = "staged"
include = ["cmd/**/*.go", "internal/**/*.go"]

[matcher]
kind = "co-change"
