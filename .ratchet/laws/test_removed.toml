name        = "test_removed"
description = "A Go test present at HEAD and gone from a lane's own diff needs a tombstone, not silence — `aphrollo gate` passes `--base HEAD` at precommit and premerge, so this law judges every commit against what it replaces. Admit a real removal with `// ratchet: test_removed <name>: <reason>` placed anywhere in an in-scope file; a tombstone with nothing after the colon does not count. Fixtures excluded: `.ratchet/fixtures/test_removed/` deliberately carries a base/tip pair that removes `TestFoo` on purpose, to prove the law fires."
extends     = "preset:go/test_removed"
severity    = "deny"

[scope]
include = ["cmd/**/*_test.go", "internal/**/*_test.go"]
exclude = ["**/testdata/**", ".ratchet/**"]

[matcher]
kind    = "symbol-removed"
pattern = "^func (Test[A-Za-z0-9_]+)\\("
