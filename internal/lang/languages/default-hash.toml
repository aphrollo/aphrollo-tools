# The default row that also reads `#` as a comment to the end of the line.
name = "default-hash"

[comments]
line = ["//", "#"]
block = ["/* */"]

[string.single]
open = "'"
escape = "backslash"
multiline = true

[string.double]
open = '"'
escape = "backslash"
multiline = true

[string.backtick]
open = "`"
multiline = true

[string.zig_line]
open = '\\'
close = "\n"
multiline = true
line_start = true
blank_open = true
