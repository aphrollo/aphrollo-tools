name        = "test_removed"
description = "A Rust test present at the base ref and gone at the tip needs a tombstone — see common/test_removed for the rule and the tombstone form. Matches a `#[test]` or `#[tokio::test]` attribute (sync or async) followed by its `fn`, capturing only the function name. This kind's engine (internal/ratchet/wholetree_symbol_removed.go) matches `pattern` against ONE PHYSICAL LINE at a time, never across the newline the base/tip scan itself splits on — `(?s)` is kept here because `\\s*` between the attribute and `fn` already spans a newline whenever the two are handed to the regex as a single string (a standalone pattern test does exactly that), but the base/tip line-by-line scan never joins two source lines into one call, so a `#[test]` and its `fn` on separate physical lines — the common rustfmt layout — are not recognized as one declaration by a live diff-scoped run today. Until this kind reads more than one line at a time, treat this preset as reliable only for a same-line `#[test] fn it_works() {` style, or fold the two lines together as a repo-local convention."
severity    = "deny"

[scope]
include = ["**/*.rs"]
exclude = ["**/target/**"]

[matcher]
kind    = "symbol-removed"
pattern = "(?s)#\\[(?:tokio::)?test\\]\\s*(?:async\\s+)?fn\\s+([A-Za-z0-9_]+)"
