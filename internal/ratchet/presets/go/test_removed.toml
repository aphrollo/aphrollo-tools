name        = "test_removed"
description = "A Go test present at the base ref and gone at the tip needs a tombstone — see common/test_removed for the rule and the tombstone form. `pattern` captures only a `Test`-prefixed top-level function other than `TestMain`, so a `Benchmark` function, a lowercase helper or a package's TestMain entry point coming or going is never this law's business, and it never fires inside a file the base ref never had."
severity    = "deny"

[scope]
include = ["**/*_test.go"]

[matcher]
kind    = "symbol-removed"
pattern = "^func (Test(?:[A-LN-Za-z0-9_][A-Za-z0-9_]*|M|Ma|Mai|M[A-Z0-9_b-z][A-Za-z0-9_]*|Ma[A-Z0-9_a-hj-z][A-Za-z0-9_]*|Mai[A-Z0-9_a-mo-z][A-Za-z0-9_]*|Main[A-Za-z0-9_]+))\\("
