name        = "bench_ceiling"
description = "A Go benchmark's B/op and allocs/op, read out of a `go test -bench -benchmem` text file, may only fall — sec/op is wall-clock noise this law never judges."
severity    = "deny"

[scope]
include = ["testdata/bench/baseline.txt"]

[matcher]
kind  = "go-bench-ceiling"
files = "testdata/bench/baseline.txt"
