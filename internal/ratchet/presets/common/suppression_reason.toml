name        = "suppression_reason"
description = "Every #[allow]/#[expect] states its reason on the line — a suppression with no reason is a rule nobody can review."
severity    = "deny"

[scope]
include = ["**/*.rs"]
exclude = ["**/target/**"]

[matcher]
kind    = "marker-within-lines"
trigger = "#!?\\[(allow|expect)\\("
marker  = "reason\\s*="
lines   = 0
