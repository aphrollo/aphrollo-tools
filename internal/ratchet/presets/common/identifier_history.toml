name        = "identifier_history"
description = "A name says what a thing IS, never when it was written — no _v2/_new/_old/_legacy/_deprecated suffix carrying history instead of meaning."
severity    = "warn"

[scope]
include = ["**/*.rs", "**/*.go", "**/*.py", "**/*.ts"]
exclude = ["**/target/**", "**/node_modules/**", "**/vendor/**"]

[matcher]
kind    = "regex-absent"
pattern = "\\b[A-Za-z0-9]+_(v[0-9]+|new|old|legacy|deprecated)\\b"
key     = "file:line-content-hash"
