version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    assignees: ["trickstertwo"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    assignees: ["trickstertwo"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
