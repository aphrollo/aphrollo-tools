name: Nightly fuzz

# Runs the native Go fuzz targets for real, past their seed corpus, on a
# schedule rather than per-PR: 60 s each across the 8 targets is ~8 minutes,
# too slow for the PR pipeline's per-push budget but cheap once a night. A
# crash opens an issue through `gate issue` with the reproducer attached —
# the same mechanism the rest of the gate uses for an open point, so a fuzz
# finding lands exactly like any other one.

on:
  schedule:
    - cron: "17 9 * * *" # nightly, off the hour so it does not contend with other cron jobs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the CLI from this tree
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: Fuzz every target for 60s
        id: fuzz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          declare -A targets=(
            ["internal/ratchet"]="FuzzParseLaw FuzzBaseline"
            ["internal/tdd"]="FuzzReceipt FuzzGateLogLine FuzzBashWriteTargets FuzzDocsOnlyClassifier"
            ["internal/cli"]="FuzzGitShimArgv FuzzCargoShimArgv"
          )
          overall=0
          for pkg in "${!targets[@]}"; do
            for name in ${targets[$pkg]}; do
              echo "=== fuzzing $name in $pkg (60s) ==="
              log="fuzz-${name}.log"
              if go test "./${pkg}/..." -run=NONE -fuzz="^${name}\$" -fuzztime=60s >"$log" 2>&1; then
                echo "$name: no crash"
                continue
              fi
              overall=1
              echo "$name: CRASHED"
              cat "$log"
              # The failing corpus entry go test just wrote is the reproducer;
              # newest file under the target's testdata/fuzz dir is it.
              repro=$(find "${pkg}/testdata/fuzz/${name}" -type f -newer go.mod 2>/dev/null | head -1)
              body="\`go test ./${pkg}/... -run=${name} -fuzz=^${name}\$\` crashed on the CI runner tonight.

          Log (tail):
          \`\`\`
          $(tail -c 6000 "$log")
          \`\`\`"
              if [ -n "$repro" ]; then
                body="$body

          Reproducer: \`$repro\`
          \`\`\`
          $(cat "$repro")
          \`\`\`"
              fi
              ./bin/aphrollo gate issue "fuzz: $name found a crash" --new-label --label fuzz --body "$body" || \
                echo "::warning::gate issue failed for $name — see the log above"
            done
          done
          exit $overall
      - name: Upload fuzz logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-logs
          path: fuzz-*.log
          if-no-files-found: ignore
