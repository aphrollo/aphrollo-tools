name: Undercover text

# Some environments append an attribution footer to a PR body or comment
# AFTER the text leaves the client, where aphrollo's own pre-post check never
# sees it. This job reads what actually landed: the PR title and body, every
# issue comment, every review comment, and the author, committer and
# Co-authored-by trailers of every commit on the PR (a squash merge copies
# each commit author into main). A trailing footer carrying a tell is
# stripped and the text rewritten with the workflow's token; any other hit
# fails the job, quoting the line, and is left unedited. Inert unless
# aphrollo.toml sets `undercover = true` (the subcommand reads it).
#
# Its own workflow, not a job in pipeline.yml: the comment triggers would
# otherwise start every pipeline job on every comment, and pipeline.yml's
# cancel-in-progress concurrency would let a PR-body edit cancel the running
# pipeline and replace it with one whose required checks all skip.
#
# The job builds the tool from the default branch, never from the PR head:
# it holds a token that can edit PR text, so it runs code that has already
# been reviewed and merged.

on:
  pull_request:
    types: [opened, edited, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: undercover-text-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  undercover-text:
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Strip a tool footer, fail on any other tell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run -trimpath -buildvcs=false ./cmd/aphrollo ci undercover-text --event "$GITHUB_EVENT_PATH"
