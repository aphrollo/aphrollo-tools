name: Pipeline

# CI quality gate for aphrollo-tools, mirroring aphrollo-agents/pipeline.yml so
# every Go repo on the box is gated the same way. Runs on the org's self-hosted
# runner (serial across jobs).
#
# NOTE ON DEPLOY: this workflow does NOT install the binary. /usr/local/bin/aphrollo
# is built and installed by aphrollo-infra (ansible site.yml, task "build aphrollo
# dev-env CLI") behind the manual deploy-infra.yml gate, from the operator clone
# at ~/spaces/aphrollo/aphrollo-tools. To ship a merged change:
#   1. pull the operator clone to the intended commit (it is update:false)
#   2. gh workflow run deploy-infra.yml -f check_mode=true   # dry-run first
#   3. gh workflow run deploy-infra.yml                      # real
# The `build` job below proves the binary compiles so a broken build never
# reaches that gate.

on:
  # No push trigger: PR-only repo (branch protection enforces PR), and tools deploys via aphrollo-infra, not on push — so a push-to-main re-run would be pure duplicate of the PR run.
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go.mod tidy
        # aphrollo-tools is pure stdlib (no go.sum). A clean worktree after
        # `go mod tidy` is the signal that go.mod has not drifted.
        run: |
          go mod tidy
          git diff --exit-code
      - run: go vet ./...
      # -race catches data races, -shuffle=on catches order-dependent tests,
      # -count=1 disables the test cache so a stale pass can't hide a regression.
      # The tdd package's real-git integration tests need `git` on PATH (the
      # runner has it) and inject fakes for the suite runner / LLM reviewer, so
      # no live `claude` is required.
      - name: Test (race + shuffle)
        run: go test -race -count=1 -shuffle=on -timeout=180s ./...

  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        # per-run isolated cache — shared self-hosted golangci cache otherwise stale-locks / dead worktree paths → spurious lint failures
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

  vulncheck:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: govulncheck ./...

  sast:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Opengrep
        # Replaces the fragile `curl install.sh | bash` with a SHA-pinned binary download.
        env:
          OPENGREP_VERSION: v1.21.0
          OPENGREP_SHA256: 9ed0ceee4a3a406d27d40894bcce85ea151be21e6d4b180689689224faff2a3e
        run: |
          set -euo pipefail
          DEST="$HOME/.opengrep/cli/${OPENGREP_VERSION}"
          mkdir -p "$DEST"
          if [ ! -x "$DEST/opengrep" ]; then
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86" \
              -o "$DEST/opengrep.tmp"
            echo "${OPENGREP_SHA256}  $DEST/opengrep.tmp" | sha256sum -c -
            chmod +x "$DEST/opengrep.tmp"
            mv "$DEST/opengrep.tmp" "$DEST/opengrep"
          fi
          # Verify on every run, not just first download — a binary pre-planted
          # on the persistent self-hosted-runner $HOME would otherwise run unverified.
          echo "${OPENGREP_SHA256}  $DEST/opengrep" | sha256sum -c -
          ln -sfn "$DEST" "$HOME/.opengrep/cli/latest"
      - name: Opengrep scan
        run: |
          ~/.opengrep/cli/latest/opengrep scan \
            --config p/golang \
            --severity ERROR \
            --no-rewrite-rule-ids \
            .

  secret-scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Cache gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: gitleaks
          key: gitleaks-8.30.1-linux-x64
      - name: Download gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
      - name: gitleaks
        run: ./gitleaks detect --no-banner --redact -v --exit-code 1

  build:
    # Deploy-readiness: prove the binary compiles with the same flags
    # aphrollo-infra uses to install it, so a broken build never reaches the
    # deploy-infra gate. This does NOT install — see the header note.
    needs: [test, lint, vulncheck, sast, secret-scan]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build aphrollo CLI
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: Smoke the binary
        run: ./bin/aphrollo tdd --help >/dev/null && ./bin/aphrollo --help >/dev/null
