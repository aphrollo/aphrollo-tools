name: Pipeline

# CI quality gate for aphrollo-tools, mirroring aphrollo-agents/pipeline.yml so
# every Go repo on the box is gated the same way. The repo is public, so every
# job a pull_request event can run uses a GitHub-hosted runner (ubuntu-latest):
# a fork's code never reaches a self-hosted host. Nothing here reads state left on the box: each job builds
# the CLI from its own checkout and installs the tools it calls.
#
# RELEASE: nothing deploys on merge. The `release` job below tags the merge, and
# every box runs `aphrollo update` to move to a tag. See deploy/README.md.

on:
  # Draft PRs run NO CI: the check jobs below gate on `pull_request.draft != true`,
  # so a coder's in-progress draft pushes burn zero runner. CI fires when the PR
  # leaves draft — the `ready_for_review` activity, added explicitly here since it
  # is NOT in the default opened/synchronize/reopened set — and on every push
  # while ready (the reviewer loop). A draft PR is unmergeable by its draft status,
  # so checks that are skipped while draft never deadlock the required-check gate;
  # the ready_for_review run reports them fresh.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue runs the pipeline on a temporary branch holding the queued
  # change on top of the base (and of every entry ahead of it), and merges only
  # when every required check reports there. Draft and event guards below are
  # written so each required job runs on this event: `pull_request.draft` is
  # absent here, so `!= true` holds. `pr-ratchet` runs against the group's
  # base_sha; the jobs that need a pull request (version-check, the mutation
  # measurement) are not required and skip.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs. Push-to-main runs are NOT cancelled so a release
# in flight is not preempted by a follow-up commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide how much checking the change owes. The class comes from
  # `aphrollo gate classify-diff`, built from THIS PR: the same per-file rules
  # the commit gate takes its fast paths from (ClassifyFile with its
  # //go:embed awareness, and the token-level comment-only comparison for Go
  # and Rust), held to that gate's choice by
  # internal/cli/classifydiff_test.go. No path regex here second-guesses it.
  #
  #   docs-only      only prose (markdown, docs/, LICENSE, .gitignore):
  #                  docs-check and scan's gitleaks, no Go job
  #   comment-only   Go/Rust changes only inside comments, plus prose: lint
  #                  as well, no suite, race run, benchmarks or mutants
  #   workflow-only  only .github/**, plus prose: workflow-pins runs the
  #                  tests that read this repo's workflow files
  #   code           anything else, and every failure to classify: the full
  #                  chain
  #
  # The Go gates below gate their real steps on these outputs so a skipped
  # class still reports the required contexts. The workflow uses no
  # `paths-ignore`: GitHub treats a required check that is path-filtered out
  # as permanently pending, not skipped-success.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # actions and pull-requests: only the reuse step reads them, to find
      # the pull request and its pipeline run.
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      class: ${{ steps.filter.outputs.class }}
      code: ${{ steps.filter.outputs.code }}
      lint: ${{ steps.filter.outputs.lint }}
      workflow: ${{ steps.filter.outputs.workflow }}
      docs: ${{ steps.filter.outputs.docs }}
      bench: ${{ steps.filter.outputs.bench }}
      refactor: ${{ steps.filter.outputs.refactor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the classifier from this PR
        # continue-on-error: a PR that does not compile must not fail THIS
        # job, or every job needing it is skipped and a skipped required
        # check reads as a pass. With no binary the filter answers code, and
        # the full chain's own build fails loudly instead.
        continue-on-error: true
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          # Anything but one of the four known classes -- the classifier
          # failing, printing nothing, or never having been built -- is code.
          # classify-diff itself answers code for a base this clone does not
          # hold (an all-zero `before`, a sha a force-push dropped).
          class=$(./bin/aphrollo gate classify-diff "$BASE_SHA" HEAD) || class=code
          case "$class" in
            docs-only|comment-only|workflow-only|code) ;;
            *) class=code ;;
          esac
          echo "class: $class"
          code=false; lint=false; workflow=false
          case "$class" in
            code) code=true; lint=true ;;
            comment-only) lint=true ;;
            workflow-only) workflow=true ;;
          esac
          {
            echo "class=$class"
            echo "code=$code"
            echo "lint=$lint"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"
          # The path filters below only narrow the code class further; they
          # never widen a lighter one.
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            base=$(git rev-parse --verify --quiet "HEAD~1^{commit}" || true)
          fi
          if [ -n "$base" ]; then
            changed=$(git diff --name-only "$base" HEAD)
          else
            changed=$(git ls-files)
          fi
          echo "changed files:"; printf '%s\n' "$changed"
          # docs=true iff any markdown file changed, so the docs-check job runs
          # on doc edits (and skips a code-only PR while still reporting).
          if printf '%s\n' "$changed" | grep -qE '\.md$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          # bench=true iff the class is code and a changed file sits under one
          # of the three benchmarked packages or the baseline it compares
          # against, so `benchmarks` skips (while still reporting) a PR that
          # cannot move any of the four numbers it gates.
          if [ "$code" = true ] && printf '%s\n' "$changed" | grep -qE '^(internal/ratchet/|internal/tdd/|internal/docs/|testdata/bench/)'; then
            echo "bench=true" >> "$GITHUB_OUTPUT"
          else
            echo "bench=false" >> "$GITHUB_OUTPUT"
          fi
          # refactor=true iff the class is code and a changed file sits under
          # a package the gated gopls/sqlc e2e tests actually exercise
          # transitively, not just the two packages the tests themselves live
          # in -- a change to the LSP client or the diff-apply code they both
          # drive must install the real binaries too, or the tests self-skip
          # on exactly the commit most likely to break them. Derived, not
          # guessed: `go list -deps ./internal/refactor/... ./internal/sqlc/...
          # | grep '^github.com/aphrollo/aphrollo-tools/internal/'` names
          # internal/diff, internal/lsp, internal/refactor and internal/sqlc
          # -- keep this pattern in sync with that command's output when
          # either package's imports change.
          if [ "$code" = true ] && printf '%s\n' "$changed" | grep -qE '^(internal/refactor/|internal/sqlc/|internal/lsp/|internal/diff/)'; then
            echo "refactor=true" >> "$GITHUB_OUTPUT"
          else
            echo "refactor=false" >> "$GITHUB_OUTPUT"
          fi
      # A pull request's or merge group's run publishes the tree its checkout
      # tested (every job of a run checks out the same commit), so the push
      # that lands it can tell whether it holds that very tree. The queue
      # fast-forwards main to the group's head, so that push's tree is the
      # group's.
      - name: Record the tree this run tested
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: mkdir -p tested-tree && git rev-parse HEAD^{tree} > tested-tree/tree
      - name: Publish the tree this run tested
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-tree
          path: tested-tree/tree
          retention-days: 30
          if-no-files-found: error
      # A merge group whose tree the one pull request in it already tested
      # green (it was based on the current main) does not run the suites a
      # second time either: the step runs on merge_group too, with the group's
      # head ref, base and first parent, and `ci reuse` never reuses a group of
      # several pull requests. A skipped matrix job would leave its expanded
      # required checks pending, so test-windows still runs its shards on a
      # merge group with every step standing down.
      #
      # A push to main whose tree an earlier run already tested green does
      # not run the suites again: `reuse=true` stands the test, test-windows,
      # gate-env, lint and benchmarks jobs down, and `release` still runs
      # behind the skipped jobs. `aphrollo ci reuse` says yes only for a
      # first-attempt successful pipeline run from this repository, a
      # successful run of each step named below in the jobs named (the job
      # concluding success is not enough: a skipped job does), and a recorded
      # tested tree equal to this commit's. The run is the merge group's whose
      # head is this very commit (the queue fast-forwards main to it; the
      # earlier commits of a larger group have no run of their own), else the
      # merged pull request's whose merge commit is this one. Anything else, a
      # lookup that failed, or a binary that was never built leaves the output
      # false and the full suite runs as before. scan is not reused:
      # govulncheck reads a vulnerability database that moves without the tree.
      # The step names below are pinned to the jobs' by
      # TestPipeline_ReuseRequirementsNameRealJobsAndStepsAndCoverTheSkippedJobs.
      - name: Reuse the merged pull request's verdict
        id: reuse
        if: (github.event_name == 'push' || github.event_name == 'merge_group') && steps.filter.outputs.class == 'code'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # Only a merge group reads these two; a push passes them empty.
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -uo pipefail
          # ci reuse prints its answer on stdout and its reason on stderr. A
          # missing binary or a refused command line prints no answer, which
          # reads as false.
          : > reuse-reason.txt
          # A merge group's head commit has the group's base as its first
          # parent exactly when the group holds one pull request.
          PARENT=$(git rev-parse --verify --quiet "HEAD^1" || true)
          if [ -x bin/aphrollo ] && ./bin/aphrollo ci reuse -repo "$REPO" -sha "$GITHUB_SHA" -tree "$(git rev-parse HEAD^{tree})" \
            -event "$EVENT" -head-ref "$HEAD_REF" -base-sha "$GROUP_BASE" -parent "$PARENT" \
            -workflow .github/workflows/pipeline.yml \
            -require 'test=Test (race' \
            -require 'test-windows=Test (race' \
            -require 'gate-env=Test under the gate' \
            -require 'lint=golangci-lint' \
            >> "$GITHUB_OUTPUT" 2> reuse-reason.txt; then
            :
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "ci reuse gave no answer (not built, or refused its command line)" >> reuse-reason.txt
          fi
          cat reuse-reason.txt
          {
            echo "### Test verdict reuse"
            echo
            cat reuse-reason.txt
          } >> "$GITHUB_STEP_SUMMARY"

  # A change confined to .github/** moves no Go package's behaviour. What it
  # can break is the tests that read this repo's own workflow files, so this
  # job runs exactly those, by name, instead of the full suite.
  # TestPipeline_WorkflowPinsJobSelectsEveryWorkflowReadingTest fails when a
  # test that reads .github is added outside the pattern or the package list
  # below. actionlint is installed at a pinned version and lints every workflow.
  workflow-pins:
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - if: needs.changes.outputs.workflow == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.workflow == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Workflow pin tests
        if: needs.changes.outputs.workflow == 'true'
        run: go test -count=1 -run '^(TestPipeline_|TestGateEnvWorkflowStep_|TestLintWorkflowStep_|TestNightlyFuzzWorkflow_|TestNightlyMutantsWorkflow_|TestNightlyFlakeHuntWorkflow_|TestNightlyProcWorkflow_|TestReplayWorkflow_)' ./internal/tdd ./internal/cli
      - name: actionlint
        if: needs.changes.outputs.workflow == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  # Doc-reference guard (`aphrollo docs check`): every repo path a CHANGED
  # markdown file cites must resolve. Gated on the `changes` filter (docs=true ⇔
  # a *.md changed) so a code-only PR skips it and a docs PR still reports the
  # context. Scoped to the PR's changed markdown, not the whole tree: a dangling
  # citation in any doc you touch cannot merge, without a repo-wide scan tripping
  # on legitimate cross-repo/historical references in untouched docs. Uses the
  # CLI built from this checkout; the guard resolves each citation against the
  # full checked-out tree.
  docs-check:
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - if: needs.changes.outputs.docs == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the PR base to compute the changed-markdown set
      - if: needs.changes.outputs.docs == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build aphrollo from this checkout
        if: needs.changes.outputs.docs == 'true'
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: aphrollo docs check (changed markdown)
        if: needs.changes.outputs.docs == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          aphrollo="$PWD/bin/aphrollo"
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            base=$(git rev-parse --verify --quiet "HEAD~1^{commit}" || true)
          fi
          if [ -z "$base" ]; then echo "no diff base to compute changed markdown from"; exit 0; fi
          mapfile -t mds < <(git diff --name-only --diff-filter=d "$base" HEAD -- '*.md')
          if [ "${#mds[@]}" -eq 0 ]; then echo "no changed markdown to check"; exit 0; fi
          printf 'checking %d changed markdown file(s):\n' "${#mds[@]}"; printf '  %s\n' "${mds[@]}"
          "$aphrollo" docs check "${mds[@]}"

  test:
    # Checks run on both a PR and a push to main (see the header note above):
    # `release` runs behind them either way, via an always()+needs-result guard
    # (mirrors aphrollo-api/pipeline.yml) rather than the checks standing down
    # on push.
    if: github.event.pull_request.draft != true && needs.changes.outputs.reuse != 'true'
    needs: changes
    runs-on: ubuntu-latest
    # 20, not 10: the internal/tdd split gives each subpackage its own -race
    # test binary to compile and link, and on the shared self-hosted box the
    # whole run crossed 10 minutes with every finished package green.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The suites' node and rust e2e tests self-skip when the toolchain is
      # missing, so both are installed at the versions the dev box runs.
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, toolchain input selects 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Check go.mod tidy
        if: needs.changes.outputs.code == 'true'
        # aphrollo-tools is pure stdlib (no go.sum). A clean worktree after
        # `go mod tidy` is the signal that go.mod has not drifted.
        run: |
          go mod tidy
          git diff --exit-code
      # No standalone `go vet ./...` here: golangci-lint's standard linter set
      # (`lint`, below) already runs govet over the same Linux/amd64 target,
      # so a second invocation here bought nothing but a duplicate pass on a
      # serial runner. Dropping ONE of the two per the choice this repo's own
      # issue tracker recorded — not both, or vet coverage disappears
      # entirely on a lint-skipping docs-only PR.
      #
      # Neither invocation type-checks the 9 windows-tagged files under
      # internal/ (6 production + 3 _test.go; Go excludes *_windows.go and
      # //go:build windows from a linux/amd64 vet or build), so a
      # cross-compiled vet+build stands in: cheap (~20s) because it only
      # type-checks, it never runs anything.
      - name: Vet + build the platform-tagged files (windows, darwin)
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/aphrollo
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/aphrollo
      # gopls and sqlc back the e2e suites in internal/refactor and
      # internal/sqlc, which self-skip via exec.LookPath when the binary is
      # missing. Installed when a PR touches the `refactor` filter's paths —
      # the two test packages AND the internal/lsp + internal/diff code they
      # transitively exercise (see the filter's own comment in `changes`): a
      # PR that only edits the JSON-RPC client, say, must not let these tests
      # self-skip through the one class of change most likely to break them.
      # On every other PR the suites stay skipped exactly as before, and the
      # box pays nothing for LSP/sqlc binaries it cannot exercise.
      # rust-analyzer, pyright-langserver and typescript-language-server stay
      # uninstalled — none of them is `go install`-able, so wiring them in
      # costs a second toolchain per language rather than one `go install`
      # line; their e2e
      # suites keep self-skipping.
      - name: Install gopls
        if: needs.changes.outputs.refactor == 'true'
        run: go install golang.org/x/tools/gopls@v0.23.0
      - name: Install sqlc
        if: needs.changes.outputs.refactor == 'true'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      # -race catches data races, -shuffle=on catches order-dependent tests,
      # -count=1 disables the test cache so a stale pass can't hide a regression.
      # The tdd package's real-git integration tests need `git` on PATH (the
      # runner has it) and inject a fake suite runner, so no live toolchain
      # is required. -v costs nothing extra to RUN (no re-execution), only a
      # bigger log — the SKIP-visibility step below reads it back rather than
      # invoking `go test` a second time.
      # -timeout is per test BINARY, not per package, so `go test ./...`
      # gives every package the same deadline as the slowest one. #424/#135:
      # internal/tdd measured `ok 552.491s` sequentially with exit 0 (it
      # finishes correctly, it is not hung), and `ok 733.951s` under
      # `-timeout 900s`; -race is not the cause (heaviest test 23.76s
      # without it, 23.56s with, since it is subprocess-I/O-bound, not
      # CPU-bound). 180s produced three false-red timeouts tonight (#473,
      # #484, and one prior), each panicking whichever unrelated test
      # happened to be in flight when the alarm fired. 600s matches the
      # budget the local gate already uses for this package and passes
      # there. This is a stopgap raising the deadline to the number the
      # package needs, not a fix for the underlying runtime: #135 (splitting
      # the package) is the real fix, tracked by #424, which stays open.
      # 1500s, not 600s (#1239): a pull_request run on a developer box (ci run, the
      # fallback when hosted runners never start) runs this step below normal
      # priority beside other work, and internal/cli alone then outran 600s under
      # -race. The hosted job is still bounded by timeout-minutes above.
      - name: Test (race + shuffle)
        if: needs.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          go test -race -count=1 -shuffle=on -timeout=1500s -v ./... | tee test-output.log
      # The refactor/sqlc e2e tests self-skip silently (a `t.Skip` reads as a
      # pass), so a pipe wiring or capability-negotiation regression could
      # land on main green with nobody noticing the coverage never ran. This
      # names each one explicitly from the single -v run above, so PASS vs.
      # SKIP is a line in the job summary rather than something a reader has
      # to go dig the raw log for.
      - name: Report refactor/sqlc e2e coverage
        if: needs.changes.outputs.code == 'true'
        run: |
          set -uo pipefail
          names='TestRename_Gopls_CrossFile TestFindReferences_Gopls TestRename_Gopls_Apply TestOutline_Gopls TestShow_Gopls TestCheckCleanRepoReportsNoDrift TestCheckDetectsDrift TestReportedOnlyConfigDoesNotFlagGatedDrift TestRegenScopedAppliesOnlyChangedQuery'
          {
            echo "### refactor/sqlc e2e coverage (LSP servers + sqlc binary)"
            echo
            for n in $names; do
              line=$(grep -E "^--- (PASS|SKIP|FAIL): $n \(" test-output.log)
              if [ -z "$line" ]; then line="--- ????: $n (not found in test output)"; fi
              echo "- $line"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The pre-merge gate on the developer's Windows box re-runs the same `go test
  # -race` on the merged tree, and two packages (internal/tdd/mutation and
  # internal/cli) each outrun that box's per-run cap alone, so a merge was
  # refused with every check green. This job is CI's own Windows verdict for
  # the same command, split so each heavy package has a shard to itself, which
  # lets the merge gate take CI's word for the tree it tested. It is not a
  # required check yet: the repo owner adds that in the branch protection.
  #
  # Shards partition `go list ./...`: mutation, cli, the internal/tdd root,
  # the internal/tdd subpackages, and everything else. -timeout is per test
  # binary, as in `test` above.
  test-windows:
    # On a merge group the job runs even when reuse stands the suites down:
    # a matrix job skipped here would not report the expanded checks the
    # queue requires. The steps below stand down on reuse instead.
    if: github.event.pull_request.draft != true && (needs.changes.outputs.reuse != 'true' || github.event_name == 'merge_group')
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        shard: [mutation, cli, tdd-root, tdd-sub, rest]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The checkout would otherwise turn every fixture's line endings into
      # CRLF (Git for Windows ships core.autocrlf=true), and the fixtures
      # compare exact bytes.
      - if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test (race + shuffle), shard ${{ matrix.shard }}
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          # The default temp dir is spelled with the short name RUNNER~1 for
          # the user directory runneradmin; tests that compare a path they
          # made with one a tool resolved read the two as different
          # directories. runner.temp is the long form.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          m=$(go list -m)
          case "$SHARD" in
            mutation) pkgs="$m/internal/tdd/mutation" ;;
            cli) pkgs="$m/internal/cli" ;;
            tdd-root) pkgs="$m/internal/tdd" ;;
            tdd-sub) pkgs=$(go list ./internal/tdd/... | grep -vx -e "$m/internal/tdd" -e "$m/internal/tdd/mutation") ;;
            rest) pkgs=$(go list ./... | grep -v -e "^$m/internal/tdd" -e "^$m/internal/cli\$") ;;
            *) echo "unknown shard $SHARD"; exit 1 ;;
          esac
          [ -n "$pkgs" ] || { echo "shard $SHARD holds no package"; exit 1; }
          echo "$pkgs"
          go test -race -count=1 -shuffle=on -timeout=1500s $pkgs

  # Issue #542 / escape #541: every job above runs `go test` directly, and
  # nothing sets the environment `suiteEnv` (internal/tdd/postedit/posttooluse.go)
  # actually builds around a suite it runs as a `go` runner -- goTmpEnv's four
  # temp-dir variables, redirected to a repo-local scratch dir. So a
  # regression in that redirect is green in every job above and red on the
  # next developer's commit, the moment the gate itself runs this package.
  # That already escaped twice: #532 (the scratch dir resolved INSIDE the
  # worktree, so `.git` as a rootMarker made every t.TempDir() fixture
  # inherit it as an unrequested project root) and #541
  # (TestSuiteEnv_NonGoRunnerLeavesTempVarsAlone asserted the ABSENCE of
  # GOTMPDIR, which is exactly the variable the gate's own `go` runner sets,
  # so the test flagged the gate's own environment as a defect).
  #
  # This does NOT run the real `aphrollo gate precommit` (440-780s, and
  # pointing the gate at its own repository invites recursion) -- it
  # reproduces the one piece of the gate's environment these escapes are
  # about, at the price of an ordinary test job, exactly as proposed in #542.
  #
  # Linux only, and the matrix is kept for that one leg so a second platform
  # is one entry away. This job used to carry a windows-latest leg as well,
  # because #532/#528's split came from t.TempDir() reading TMPDIR on Unix
  # and TMP/TEMP on Windows. The Windows half is now answered where it is
  # free: the pre-merge gate runs on the developer's own Windows box and
  # BUILDS this environment itself -- suiteEnv/goTmpEnv is production code
  # there, not a job re-creating it by hand -- so a regression in the
  # redirect is red at the merge on the real thing. The gap that leaves, and
  # the reason this note names it: the gate's mechanical run is SCOPED to the
  # packages a merge stages, so a merge that touches nothing under
  # internal/tdd does not re-run internal/tdd on Windows. See the note above
  # (`test-windows`) for what the hosted Windows job covers instead.
  #
  # Scoped to ./internal/tdd/..., the package suiteEnv/goTmpEnv live in --
  # not folded into `test` above, whose own budget is sized
  # for the rest of the tree. -timeout=1500s rather than go test's 600s
  # default: this package alone measured `733.951s` under load in the `test`
  # job's own history (see that job's "Test (race + shuffle)" step comment),
  # and a plain `go test ./internal/tdd/...` here measured past the 600s
  # default and hit its own internal alarm before finishing, on this
  # contended box -- an unrelated timeout must not read as this job's
  # signal. 900s was the previous figure and is no longer enough: the
  # package measures 927s locally, so a 900s alarm fires on a healthy run.
  # 1500s keeps roughly 60% headroom over that measurement while still being
  # far short of a hung run. timeout-minutes leaves headroom over the go
  # alarm on top of checkout/setup, so it moves with it: 30 minutes against
  # a 25-minute test budget.
  #
  # The four variable names below are hardcoded rather than derived from
  # goTmpEnv (internal/tdd/lock/gotmpdir.go) at YAML-eval time: goTmpEnv is
  # unexported, and nothing short of a build-time entry point added solely to
  # serve this one step would let a workflow step read it from outside the
  # package. Keep this list in sync with goTmpEnv's own return slice (and the
  # tempEnvKeys var internal/tdd/suite/gotmpdir_test.go asserts both suiteEnv halves
  # against) if either changes.
  gate-env:
    if: github.event.pull_request.draft != true && needs.changes.outputs.reuse != 'true'
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            cache: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ matrix.cache }}
      - name: Test under the gate's own suiteEnv (GOTMPDIR/TMPDIR/TMP/TEMP)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gate-env"
          mkdir -p "$dir"
          # A Linux runner's path is already the form goTmpEnv produces there,
          # so it is exported as-is. A Windows leg would NOT be: goTmpEnv
          # builds its directory with filepath.Join, which on Windows yields
          # backslashes throughout, and exporting a mixed-separator path
          # instead makes tests comparing a raw os.TempDir() against a
          # filepath-normalized one fail on the separator rather than on
          # anything this job exists to catch. `dir="$(cygpath -w "$dir")"`
          # is the normalization to restore if a Windows leg is ever added
          # back to the matrix above.
          export GOTMPDIR="$dir" TMPDIR="$dir" TMP="$dir" TEMP="$dir"
          go test ./internal/tdd/... -count=1 -timeout=1500s

  lint:
    if: github.event.pull_request.draft != true && needs.changes.outputs.reuse != 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # Keyed on `lint`, not `code`: a comment-only change can still fail it
    # (a vet or staticcheck finding in a directive, a malformed doc comment),
    # so it runs for comment-only as well as code.
    steps:
      - if: needs.changes.outputs.lint == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.lint == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Every network fetch of this job happens in the two retried steps below
      # (the modules, then the pinned linter), so a transient proxy or
      # sum.golang.org failure fails a step named for the download, never the
      # lint verdict. The module cache is the one setup-go restores above, keyed
      # like the test job's, so a warm cache makes the download a no-op.
      - name: download modules
        if: needs.changes.outputs.lint == 'true'
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt of 3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: build aphrollo
        if: needs.changes.outputs.lint == 'true'
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: install golangci-lint
        if: needs.changes.outputs.lint == 'true'
        run: |
          for attempt in 1 2 3; do
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 && exit 0
            echo "golangci-lint install failed (attempt $attempt of 3)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: golangci-lint
        if: needs.changes.outputs.lint == 'true'
        # per-run isolated cache — shared self-hosted golangci cache otherwise stale-locks / dead worktree paths → spurious lint failures
        # GOPROXY=off + -mod=readonly: the lint verdict reads only the modules
        # the download step put in the cache and never reaches for the network.
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-${{ github.run_id }}-${{ github.run_attempt }}
          GOPROXY: off
          GOFLAGS: -mod=readonly
        # --allow-serial-runners makes a SECOND golangci-lint on this box
        # retry its own machine-wide lock ($TMPDIR/golangci-lint.lock)
        # forever instead of giving up after 5s — that part always worked.
        # What it cannot fix: that lock file is opened 0600 by whichever
        # ACCOUNT creates it first (gofrs/flock's default permission, no
        # WithPermissions option), so this self-hosted runner (user
        # github-runner) and a local commit gate (user debian) sharing this
        # box's one /tmp can hit a hard PERMISSION error instead of ordinary
        # contention — golangci-lint reports both identically, "parallel
        # golangci-lint is running", exit 3, and a permission error never
        # clears by waiting (PR #740, run 35813979089, hit this live).
        # `gate lint` is the one entry point both sides now use: it takes
        # this repo's own cross-account lock (internal/tdd/lock/lintlock.go,
        # /var/tmp/aphrollo-locks — world-writable, re-chmodded on open even
        # when a different account created it) before ever touching
        # golangci-lint, so at most one golangci-lint process runs across
        # every account on the box and its own internal lock always finds
        # itself free.
        run: ./bin/aphrollo gate lint run --allow-serial-runners ./...

  # The performance ratchet for the four Tier-1 benchmarks: `ratchet check`
  # cold and warm, the pre-edit judge over a generated 41-package,
  # ~10000-file fixture, and `docs check` over a 146-file markdown tree (see
  # internal/ratchet/check_bench_test.go, internal/tdd/ratchetgate_bench_test.go
  # and internal/docs/docs_bench_test.go). benchstat compares this run against
  # testdata/bench/baseline.txt; a >20% regression on ANY metric (sec/op,
  # B/op, allocs/op) fails the job. The baseline file is only ever LOWERED,
  # by hand, after a real improvement is measured here — never raised to make
  # a slow change pass.
  #
  # Gated on `bench` rather than `code`: this job's own steps cost ~0.7m even
  # on a PR that never touches internal/ratchet, internal/tdd, internal/docs
  # or testdata/bench — packages whose behaviour cannot move any of the four
  # numbers below. `bench` narrows that to the PRs that can.
  benchmarks:
    if: github.event.pull_request.draft != true && needs.changes.outputs.reuse != 'true'
    needs: changes
    runs-on: ubuntu-latest
    # Measured generating testdata/bench/baseline.txt on a Windows dev box:
    # BenchmarkRatchetCheckCold's fixture build + ~45s/iter bench dominates —
    # six reps of the whole ratchet package took 1375s there. -count=3 here
    # trades some of the baseline's statistical power for a job that fits a
    # PR's budget; benchstat compares samples of different size fine.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - if: needs.changes.outputs.bench == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.bench == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the benchmarks
        if: needs.changes.outputs.bench == 'true'
        shell: bash
        run: |
          # set -e alone lets `go test ... | tee new-bench.txt` pass with
          # tee's own exit 0 even when `go test` itself failed to build or
          # panicked — pipefail is what makes the LEFT side of that pipe's
          # exit code the step's own, so a build failure stops here instead
          # of feeding a truncated/absent new-bench.txt into benchstat as if
          # it were a clean, comparable run.
          set -euo pipefail
          # -cpu=1 pins GOMAXPROCS, which Go stamps onto every benchmark NAME
          # ("RatchetCheckCold-24" vs "-8") — but Go OMITS the suffix
          # entirely when procs is 1 ("RatchetCheckCold", no "-N" at all).
          # testdata/bench/baseline.txt is recorded the same way, so a run on
          # any runner produces the exact same names benchstat groups by.
          go test ./internal/ratchet/... ./internal/tdd/... ./internal/docs/... -run=NONE \
            -bench '^(BenchmarkRatchetCheckCold|BenchmarkRatchetCheckWarm|BenchmarkPreEditJudge|BenchmarkDocsCheck)$' \
            -benchmem -cpu=1 -count=3 -timeout=20m | tee new-bench.txt
      - name: Install benchstat
        if: needs.changes.outputs.bench == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70
      - name: Compare against the baseline, fail on a >20% regression
        if: needs.changes.outputs.bench == 'true'
        run: |
          set -euo pipefail
          # benchstat groups by the FULL config (goos/goarch/cpu lines
          # included), so the baseline recorded on a developer's box and a
          # run on this Linux runner would never land in the same group and
          # print with no "vs base" column at all — silently comparing
          # nothing. Stripping those lines is what makes the comparison
          # cross-machine; testdata/bench/baseline.txt is checked in without
          # them for the same reason.
          grep -v '^goos:\|^goarch:\|^cpu:' new-bench.txt > new-bench-nohdr.txt
          benchstat testdata/bench/baseline.txt new-bench-nohdr.txt | tee compare.txt
          # A renamed benchmark, a suffix mismatch, or a package that ran but
          # produced no matching rows all show up as benchstat's OWN "the
          # benchmark set differs from baseline" note and a "?" where a
          # percentage belongs — not as "no regression", as "nothing was
          # actually compared". That must fail loudly: a silently-empty
          # comparison is the one failure mode this whole job exists to
          # rule out.
          if grep -q 'benchmark set differs from baseline' compare.txt; then
            echo "::error::benchmark set differs from testdata/bench/baseline.txt — benchstat could not compare like-for-like (a renamed/missing benchmark?); see compare.txt above"
            exit 1
          fi
          # sec/op is wall-clock, informational only here: the baseline was
          # RECORDED on a developer's box, not this runner, so an absolute
          # timing delta between the two machines is not a code regression.
          # B/op and allocs/op are the algorithm's own footprint — the same
          # on any machine — so those two are the actual gate. `|| true` is
          # only on this grep: no match is the common (no-regression) case,
          # and grep's own exit 1 for "nothing found" must not read as this
          # STEP failing under `pipefail` before the threshold below runs.
          worst=$(awk 'BEGIN{RS=""; ORS="\n\n"} !/sec\/op/' compare.txt \
            | grep -oE '\+[0-9]+\.[0-9]+%' | tr -d '+%' | sort -rg | head -1 || true)
          if [ -n "${worst:-}" ] && awk -v w="$worst" 'BEGIN{exit !(w>=20)}'; then
            echo "::error::benchmark regressed by ${worst}% (B/op or allocs/op), over the 20% budget — see compare.txt above"
            exit 1
          fi
      - name: Upload the comparison
        if: ${{ always() && needs.changes.outputs.bench == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchstat-comparison
          path: |
            new-bench.txt
            compare.txt
          if-no-files-found: warn

  # The mutation proof on MAIN used to run here, per push -- it now runs
  # nightly instead, batched across merges, to stop holding one of the two
  # shared self-hosted runners for the length of the run right after a
  # deploy that already shipped (issue #334). See
  # .github/workflows/nightly-mutants.yml for the job and why moving it was
  # safe: the merge itself is measured before it lands, by the pre-merge gate.
  #
  # The mutation measurement of a PR is three jobs, and only the last is
  # required. `mutants-plan` reads aphrollo.toml and says whether a
  # measurement is owed and how many shards it divides into;
  # `mutants-shard` is a matrix of that many jobs on GitHub-hosted runners,
  # each measuring its slice of the lane's changed source files; and
  # `mutants-verdict` merges the slices and judges them once. The aggregate
  # keeps the name `mutants-verdict` because branch protection requires that
  # exact name, and because the local merge gate reads a check by it
  # (internal/tdd/mutation/mutants_ci.go).
  #
  # The measurement is made HERE and consumed THERE: on a Windows box gremlins
  # cannot measure at all (issue #697, docs/mutation-runner.md), so the merged
  # measurement is published as an artifact named for the tree it measured.
  # All of it is gated on `changes.code`, so a docs-only PR pays nothing and
  # still reports the required context.
  mutants-plan:
    # Pull requests only. A push to main has no merge to measure ahead of
    # itself and nightly-mutants.yml is the tripwire that covers trunk.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      on: ${{ steps.cfg.outputs.on }}
      count: ${{ steps.cfg.outputs.count }}
      shards: ${{ steps.cfg.outputs.shards }}
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The job measures while `mutants-in-ci` is on, falling back to
      # `mutants-at-merge` (true or "ci") when the repo does not set it. The
      # shard count is `mutants-shards`, 4 when absent.
      - name: Is the measurement on, and across how many shards
        id: cfg
        env:
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          if [ "$CODE" != true ]; then
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo 'shards=[0]' >> "$GITHUB_OUTPUT"
            echo "no code changed: no measurement"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, tomllib
          a = tomllib.load(open('aphrollo.toml', 'rb')).get('aphrollo', {})
          v = a.get('mutants-in-ci', a.get('mutants-at-merge', False))
          count = max(1, int(a.get('mutants-shards', 4)))
          print('on=' + str(v is True or v == 'ci').lower())
          print('count=%d' % count)
          print('shards=' + json.dumps(list(range(count))))
          PY

  mutants-shard:
    name: mutants-shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && needs.mutants-plan.outputs.on == 'true'
    needs: mutants-plan
    runs-on: ubuntu-latest
    # 60, not 30: a lane of ~70 mutants measured under load was still killing
    # mutants when a 30-minute budget cancelled it, so the check read red for a
    # measurement that had found nothing wrong.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default ref for a pull_request event is refs/pull/N/merge --
          # GitHub's own merge of this PR into its base, which is the same
          # tree the local pre-merge gate builds. fetch-depth 0 so both of its
          # parents resolve: the diff is scoped to merge-base(base, head).
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Build the CLI from this PR
        # From THIS PR, not /usr/local/bin: a change to how the measurement is
        # scoped, judged or published is measured by the rule the PR proposes.
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: aphrollo gate mutants run --shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutants-plan.outputs.count }}
        run: |
          set -euo pipefail
          # HEAD is the merge; HEAD^1 is the base it was merged into and HEAD^2
          # is this PR's tip. Their merge base is what the lane actually
          # proposes to change, so every shard scopes the same diff over the
          # same tree, which is what lets them divide its files without gaps.
          base=$(git merge-base HEAD^1 HEAD^2)
          echo "shard $SHARD of $SHARDS, scoped to $base..HEAD"
          ./bin/aphrollo gate mutants run --base "$base" --shard "$SHARD/$SHARDS" --report "mutants-shard-$SHARD.json"
      - name: Publish this shard's outcomes for the verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants-shard-${{ matrix.shard }}.json
          # A re-run of a failed shard replaces its own artifact.
          overwrite: true
          if-no-files-found: warn

  # The one required check. It runs on every non-draft PR, measuring or not, so
  # the required context always reports; it fails when the plan failed, when
  # any shard did, or when the merged outcomes are refused.
  mutants-verdict:
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft != true }}
    needs: [changes, mutants-plan, mutants-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: The measurement's own jobs
        id: gate
        env:
          CHANGES: ${{ needs.changes.result }}
          PLAN: ${{ needs.mutants-plan.result }}
          SHARDS: ${{ needs.mutants-shard.result }}
          ON: ${{ needs.mutants-plan.outputs.on }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != success ] || [ "$PLAN" != success ]; then
            echo "::error::the jobs that decide the measurement did not succeed (changes: $CHANGES, mutants-plan: $PLAN), so no mutation evidence exists"
            exit 1
          fi
          if [ "$ON" != true ]; then
            echo "no measurement owed: mutants-in-ci is off in aphrollo.toml, or no code changed"
            echo "measure=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SHARDS" != success ]; then
            echo "::error::mutants-shard finished $SHARDS, so some mutants were NOT measured"
            exit 1
          fi
          echo "measure=true" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.measure == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Identify the merged tree
        # Read before anything else writes into the checkout, and read the
        # same way the consuming gate reads it (internal/tdd/mutation/mutants_runner.go:
        # `git write-tree`), because the tree id is the whole binding between
        # this measurement and the merge that consumes it. The shards' reports
        # carry the id the CLI computed on their own checkouts, and the merged
        # verdict is refused unless they are all this tree.
        id: tree
        if: steps.gate.outputs.measure == 'true'
        run: |
          set -euo pipefail
          echo "id=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.measure == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the CLI from this PR
        if: steps.gate.outputs.measure == 'true'
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: Download the shards' outcomes
        if: steps.gate.outputs.measure == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-shard-*
          path: shards
          merge-multiple: true
      - name: aphrollo gate mutants verdict
        if: steps.gate.outputs.measure == 'true'
        env:
          SHARDS: ${{ needs.mutants-plan.outputs.count }}
        run: |
          set -euo pipefail
          ./bin/aphrollo gate mutants verdict --shards "$SHARDS" --report mutants-verdict.json shards/*.json
      - name: Publish the measurement for the box that cannot make it
        # always(): a run that found an unaccepted survivor exits 1, and that
        # is precisely the measurement the merging box most needs to see. A
        # run that produced no report at all uploads nothing and the merge
        # reports NOT MEASURED, which is the honest outcome either way.
        if: ${{ always() && steps.tree.outputs.id != '' && steps.gate.outputs.measure == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The tree id is in the name so the consuming gate finds the
          # measurement of ITS tree in one request. A base branch that moves
          # after this ran produces a different merged tree, no artifact under
          # that name, and a merge that says NOT MEASURED rather than one that
          # trusts a measurement of the tree before the move.
          name: mutants-verdict-${{ steps.tree.outputs.id }}
          path: mutants-verdict.json
          overwrite: true
          if-no-files-found: warn

  # `aphrollo ratchet check` on the PR's own merged tree, BEFORE the merge.
  # Without this job the law engine runs nowhere on a PR: the only place it
  # otherwise runs is the local pre-commit/pre-merge gate, and this repo's
  # own auto-merge-on-green path lets a PR land without ever going through
  # that gate. `merged-tree-ratchet` (below) catches the same regression, but
  # only AFTER the merge already produced it.
  #
  # Pull requests and merge groups only: a push to main has no merge ahead of
  # itself to check. It is a required check, so it must report on a merge-queue
  # run too (a skipped required job would pass unchecked), and it is cheap.
  #
  # Skipped only for a docs-only PR (`changes.outputs.code == 'false'`):
  # `doc_reference_exists` covers markdown, and `docs-check` already runs
  # that rule for a docs-only PR, so this job would only duplicate it there.
  # Any other change -- code or a comment-only edit -- can regress a
  # different law (module_size, test_removed, ...) docs-check never touches.
  #
  # Checks out `refs/pull/N/merge`, the pull_request event's default ref and
  # the same tree `mutants-verdict` measures. `--base` is
  # merge-base(base, head), exactly as `mutants-verdict` scopes its own
  # `--base` -- the diff side the `symbol-removed` kind (the `test_removed`
  # law) needs to see what the tree used to carry; without it that law
  # reports "skipped, no base" and silently checks nothing.
  #
  # `--no-tighten --no-cache`, exactly as `merged-tree-ratchet` runs: this is
  # a one-shot checkout nobody will commit a lowered baseline to, and no
  # cache from the box's own gate should feed a PR's verdict or be left
  # keyed to a tree this run alone produced. This job must never WRITE a
  # baseline -- only a developer's own commit or `--adopt` may lower or
  # create one.
  pr-ratchet:
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.event.pull_request.draft != true
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.lint == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.lint == 'true')
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the CLI from this PR
        if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.lint == 'true')
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: aphrollo ratchet check (the PR's merged tree)
        if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.lint == 'true')
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # On a pull request HEAD is the merge; HEAD^1 is the base it merges
          # into, HEAD^2 is this PR's own tip -- the same parents
          # `mutants-verdict` reads. On a merge group HEAD is the queued commit
          # (a squash has one parent), so the base is the group's own base_sha,
          # already an ancestor of HEAD.
          if [ -n "$MERGE_GROUP_BASE" ]; then
            base="$MERGE_GROUP_BASE"
          else
            base=$(git merge-base HEAD^1 HEAD^2)
          fi
          echo "scoping the ratchet check to $base..HEAD"
          ./bin/aphrollo ratchet check --base "$base" --no-tighten --no-cache

  # vulncheck, sast and secret-scan folded into one job (#335): three
  # independent checks that each paid their own checkout, and vulncheck also
  # its own setup-go, for no reason beyond having been three jobs. One
  # checkout (fetch-depth 0, gitleaks' own requirement) and one setup-go now
  # cover all three; each keeps its OWN step name so a failure is still
  # attributable at a glance, and `continue-on-error` + a final gate step
  # make sure one check's failure does not hide the other two's the way a
  # short-circuiting `run:` block would.
  #
  # secret-scan's steps stay UNGATED by `needs.changes.outputs.code`, exactly
  # as the job was before folding: a secret can land in any file, docs
  # included, so this is the one check in this job that must not narrow.
  scan:
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # secret-scan (gitleaks) needs the full history
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        id: vulncheck
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
      - name: Install Opengrep
        if: needs.changes.outputs.code == 'true'
        # Replaces the fragile `curl install.sh | bash` with a SHA-pinned binary download.
        env:
          OPENGREP_VERSION: v1.21.0
          OPENGREP_SHA256: 9ed0ceee4a3a406d27d40894bcce85ea151be21e6d4b180689689224faff2a3e
        run: |
          set -euo pipefail
          DEST="$HOME/.opengrep/cli/${OPENGREP_VERSION}"
          mkdir -p "$DEST"
          if [ ! -x "$DEST/opengrep" ]; then
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86" \
              -o "$DEST/opengrep.tmp"
            echo "${OPENGREP_SHA256}  $DEST/opengrep.tmp" | sha256sum -c -
            chmod +x "$DEST/opengrep.tmp"
            mv "$DEST/opengrep.tmp" "$DEST/opengrep"
          fi
          # Verify on every run, not just first download — a binary pre-planted
          # on the persistent self-hosted-runner $HOME would otherwise run unverified.
          echo "${OPENGREP_SHA256}  $DEST/opengrep" | sha256sum -c -
          ln -sfn "$DEST" "$HOME/.opengrep/cli/latest"
      - name: Opengrep scan
        id: sast
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        run: |
          ~/.opengrep/cli/latest/opengrep scan \
            --config p/golang \
            --severity ERROR \
            --no-rewrite-rule-ids \
            .
      - name: Cache gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gitleaks
          key: gitleaks-8.30.1-linux-x64
      # SHA-pinned the way the `sast` step above pins opengrep -- this used to
      # be a different job applying a different supply-chain rule to the same
      # kind of raw binary download. Verified against the published checksum
      # AND re-verified on every run (cache-hit included): a binary
      # pre-planted on the persistent self-hosted-runner cache would
      # otherwise run unverified.
      - name: Download gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xz -f gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
      - name: Verify the gitleaks binary
        env:
          GITLEAKS_BINARY_SHA256: 88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509
        # A distinct hash from the tar.gz above -- this is the EXTRACTED
        # binary, checked on a cache-hit as well as a fresh download, so a
        # cache entry cannot silently carry a swapped binary forward.
        run: echo "${GITLEAKS_BINARY_SHA256}  gitleaks" | sha256sum -c -
      - name: gitleaks
        id: secretscan
        continue-on-error: true
        # Scans what the event adds, not every branch: the full-history
        # checkout holds every lane branch, and a secret in a lane commit that
        # was since rewritten is not in anything this event lands. A base that
        # is missing (an all-zero `before` of a new branch, a sha a force-push
        # dropped) falls back to the history of HEAD alone.
        env:
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$RANGE_BASE" ] && git rev-parse --verify --quiet "$RANGE_BASE^{commit}" >/dev/null; then
            range="$RANGE_BASE..HEAD"
          else
            range=HEAD
          fi
          echo "gitleaks scans: $range"
          ./gitleaks detect --no-banner --redact -v --exit-code 1 --log-opts="$range"
      - name: Fail if any scan step failed
        # Each check above runs regardless of an earlier one's outcome
        # (continue-on-error), so this is the one place the job's overall
        # verdict is decided -- a step that never ran (skipped, outcome
        # "skipped") must not count as a failure here.
        run: |
          set -uo pipefail
          failed=""
          if [ "${{ steps.vulncheck.outcome }}" = "failure" ]; then failed="$failed govulncheck"; fi
          if [ "${{ steps.sast.outcome }}" = "failure" ]; then failed="$failed opengrep-sast"; fi
          if [ "${{ steps.secretscan.outcome }}" = "failure" ]; then failed="$failed gitleaks"; fi
          if [ -n "$failed" ]; then
            echo "::error::scan step(s) failed:$failed"
            exit 1
          fi

  # PR deploy-readiness: prove the binary compiles + runs with the same flags
  # an update builds with, so a broken build can't merge. Does NOT install (PR-only).
  build:
    if: github.event.pull_request.draft != true
    needs: [changes, test, lint, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build aphrollo CLI
        if: needs.changes.outputs.code == 'true'
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: Smoke the binary
        if: needs.changes.outputs.code == 'true'
        run: ./bin/aphrollo tdd --help >/dev/null && ./bin/aphrollo --help >/dev/null

  # On merge to main (and manual dispatch), tag the release.
  # Checks run on push too (see the header note above), so this uses the same
  # always()+needs-result guard as aphrollo-api regardless: run after they are
  # all green, but a red one means this never fires. A manual workflow_dispatch
  # stays gated behind the same guard, and runs only on main: a dispatch from a lane
  # branch would tag that unmerged commit with a real version, which `aphrollo update` would then install.
  # A tag per release: no PR carries a version. When the merge that just landed
  # brings changelog.d fragments the newest v* tag does not contain,
  # `aphrollo release plan` (built from this very commit) names the tag they
  # earn (the newest bumped by the highest level among them); deploy/tag-release.sh
  # tags this commit with it, pushes the tag and creates the GitHub Release whose
  # notes are those fragments. Nothing is committed to main. A tag that exists is
  # [skip], so a rerun does nothing, and the concurrency group below queues two
  # pushes in quick succession instead of letting them race for one tag.
  # `aphrollo update` follows the newest of these tags, not
  # the tip of main, so a box only ever runs a version a consumer was told about.
  release:
    needs: [test, lint, scan, workflow-pins]
    if: ${{ always() && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-tag-aphrollo-cli
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build aphrollo from this checkout
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: Tag the release
        run: bash deploy/tag-release.sh
        env:
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}

  # Judges the MERGED TREE itself (#372): every check above judges a PR
  # against ITS OWN base, so a lane that tightens a baseline and a lane that
  # grows the same file can each be green on their own diff and combine into
  # a tree neither ever saw. This is what actually happened -- PR #441 grew
  # internal/tdd/precommit/precommit.go to 1054 lines, PR #449 landed afterwards
  # carrying a module_size baseline of 1051 recorded against its OWN
  # (pre-#441) base, and the squash-merged result on main violated its own
  # law from the moment it landed, with nothing before this job ever
  # rechecking it.
  #
  # Runs `aphrollo ratchet check` over the tree exactly as it landed, on
  # every push to main -- not gated on the `changes` filter, because the
  # regression here was in a file NEITHER of the two merges that produced it
  # would have flagged as "changed" from its own PR's perspective. `--no-tighten`
  # and `--no-cache` keep this a pure judgement: no baseline write, no shared
  # scan-cache state with the box's own local gate.
  #
  # This CANNOT block: the push already landed by the time Actions runs, and
  # there is no such thing as rejecting a GitHub-UI merge after the fact
  # (that is the gap #372 is about in the first place). What it CAN do is
  # (a) fail loudly and by construction name the culprit merge -- this run
  # corresponds 1:1 with the push that caused it, so $GITHUB_SHA and its own
  # subject line ARE the answer, no bisection needed -- and (b) record the
  # miss as an ESCAPE, since a red the local gate never saw is exactly what
  # that loop exists to catch (issue #375). The `gh issue list --search`
  # guard keeps repeated reds on the same still-broken tree from opening a
  # new issue on every subsequent push; `aphrollo gate escape record`'s own
  # dedupe (fingerprinted, GitHub-remote-backed) is for a gate that ran and
  # disagreed with a green note on HEAD, which a GitHub-UI merge commit never
  # carries -- reusing it here would silently record nothing, the same hole
  # this job exists to close.
  merged-tree-ratchet:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the CLI from this tree
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: aphrollo ratchet check (the tree as it landed)
        id: ratchet
        continue-on-error: true
        run: |
          set -o pipefail
          ./bin/aphrollo ratchet check --no-tighten --no-cache | tee ratchet-merged-tree.txt
      - name: Record the miss as an escape (idempotent per still-broken tree)
        if: steps.ratchet.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          culprit="$(git log -1 --format='%h %s' HEAD)"
          title_needle="ratchet check red on main after a merge"
          open_count=$(gh issue list --label escape --state open \
            --search "\"$title_needle\" in:title" --json number --jq 'length')
          if [ "${open_count:-0}" -gt 0 ]; then
            echo "an open escape for a still-broken merged tree already exists -- not opening a second"
          else
            ./bin/aphrollo gate escape record \
              "$title_needle: $culprit" \
              --evidence "$(head -c 4000 ratchet-merged-tree.txt)"
          fi
      - name: Fail loudly, naming the culprit merge
        if: steps.ratchet.outcome == 'failure'
        run: |
          echo "::error::aphrollo ratchet check is RED on main at $(git rev-parse HEAD) ($(git log -1 --format='%s')) -- this push is the merge that produced (or has not yet fixed) the regression; see the ratchet output above for which law and file"
          exit 1

  # The version rule (docs/trellis-roadmap.md, Compatibility policy item 1),
  # held against every pull request. A change to what a consumer's gate says
  # is at least a minor bump. A path rule can name some of those changes (a
  # law preset, a language row, a mask) and none of the rest (a gate stage, the
  # mutation run), so the author states the bump in the PR body ("version:
  # none|patch|minor|major") and `aphrollo version check` holds the PR to it:
  # a PR that is not "none" adds exactly one changelog.d fragment of that level
  # (the release tag is made on main from the fragments, so no PR carries a
  # version number or edits VERSION or a released CHANGELOG.md section), a
  # change to the named surfaces must be a minor change at least. The body is read
  # with gh here, not taken from the event payload, so re-running the job
  # after editing the body judges the edit. Skipped for Dependabot, whose
  # dependency bumps move no verdict and cannot carry the line.
  version-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the branch itself, not the merge ref: the check measures it from its merge base with the base
          fetch-depth: 0   # the PR base must be in the clone to find the merge base and diff against it
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build aphrollo from this checkout
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: aphrollo version check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/pr-body.txt"
          ./bin/aphrollo version check --base "$PR_BASE" --body-file "$RUNNER_TEMP/pr-body.txt"
