name: Pipeline

# CI quality gate for aphrollo-tools, mirroring aphrollo-agents/pipeline.yml so
# every Go repo on the box is gated the same way. Runs on the org's self-hosted
# runner (serial across jobs).
#
# DEPLOY: this workflow installs /usr/local/bin/aphrollo on merge to main, the
# same way the Go services deploy themselves. The check jobs run on BOTH a PR
# and a push to main -- a push resolves its diff base from `github.event.before`
# rather than a PR base, and only `escape-closure`, which needs a PR number,
# stands down. After them the `deploy` job builds
# the binary + runs deploy/deploy-prod.sh, which stages a release under
# /opt/aphrollo-cli, smoke-tests it, and atomically swaps the `current` symlink.
# No daemon, no sudo, no manual deploy-infra step. See deploy/README.md for the
# release layout and the one-time aphrollo-infra prerequisites.

on:
  # Draft PRs run NO CI: the check jobs below gate on `pull_request.draft != true`,
  # so a coder's in-progress draft pushes burn zero runner. CI fires when the PR
  # leaves draft — the `ready_for_review` activity, added explicitly here since it
  # is NOT in the default opened/synchronize/reopened set — and on every push
  # while ready (the reviewer loop). A draft PR is unmergeable by its draft status,
  # so checks that are skipped while draft never deadlock the required-check gate;
  # the ready_for_review run reports them fresh.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs. Push-to-main runs are NOT cancelled so a deploy in
# flight is not preempted by a follow-up commit; the deploy job has its own
# cancel-in-progress: false group below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether the PR touches anything other than docs. The Go gates below
  # gate their real steps on this so a docs-only PR passes them legitimately
  # (nothing to test/lint/scan) while still reporting the required contexts. The
  # workflow no longer uses `paths-ignore`: GitHub treats a required check that is
  # path-filtered out as permanently pending, not skipped-success, so a docs-only
  # PR could never satisfy branch protection.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: self-hosted
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push hands over `before` rather than a PR base, and that can still
          # be unusable: the all-zero sha of a branch's first push, or a sha the
          # clone no longer holds after a force-push. Fall back to the previous
          # commit, and to "everything changed" when even that does not exist.
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            base=$(git rev-parse --verify --quiet "HEAD~1^{commit}" || true)
          fi
          if [ -n "$base" ]; then
            changed=$(git diff --name-only "$base" HEAD)
          else
            changed=$(git ls-files)
          fi
          echo "changed files:"; printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          # Only a TOP-LEVEL or docs/ markdown is documentation. This repo
          # compiles markdown into the binary (//go:embed tddskill.md,
          # agent_*.md, ratchet_laws.md, ...), so a .md sitting in a package
          # directory is code and must not take the fast path.
          elif printf '%s\n' "$changed" | grep -qvE '(^[^/]*\.md$|^docs/|^LICENSE|^\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # docs=true iff any markdown file changed, so the docs-check job runs
          # on doc edits (and skips a code-only PR while still reporting).
          if printf '%s\n' "$changed" | grep -qE '\.md$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  # Doc-reference guard (`aphrollo docs check`): every repo path a CHANGED
  # markdown file cites must resolve. Gated on the `changes` filter (docs=true ⇔
  # a *.md changed) so a code-only PR skips it and a docs PR still reports the
  # context. Scoped to the PR's changed markdown, not the whole tree: a dangling
  # citation in any doc you touch cannot merge, without a repo-wide scan tripping
  # on legitimate cross-repo/historical references in untouched docs. Uses the
  # deployed /usr/local/bin/aphrollo — the runner is the same box the CLI ships
  # to; the guard resolves each citation against the full checked-out tree.
  docs-check:
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: self-hosted
    steps:
      - if: needs.changes.outputs.docs == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the PR base to compute the changed-markdown set
      - name: aphrollo docs check (changed markdown)
        if: needs.changes.outputs.docs == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          aphrollo=/usr/local/bin/aphrollo
          if [ ! -x "$aphrollo" ]; then
            aphrollo="$(command -v aphrollo)" || { echo "aphrollo CLI not found on runner" >&2; exit 1; }
          fi
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            base=$(git rev-parse --verify --quiet "HEAD~1^{commit}" || true)
          fi
          if [ -z "$base" ]; then echo "no diff base to compute changed markdown from"; exit 0; fi
          mapfile -t mds < <(git diff --name-only --diff-filter=d "$base" HEAD -- '*.md')
          if [ "${#mds[@]}" -eq 0 ]; then echo "no changed markdown to check"; exit 0; fi
          printf 'checking %d changed markdown file(s):\n' "${#mds[@]}"; printf '  %s\n' "${mds[@]}"
          "$aphrollo" docs check "${mds[@]}"

  test:
    # Checks gate PRs; on push-to-main they're skipped and `deploy` runs behind
    # an always()+needs-result guard (mirrors aphrollo-api/pipeline.yml).
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: self-hosted
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: on the self-hosted runner the Go module + build caches already
          # persist on $HOME between jobs, so setup-go's remote cache is redundant —
          # and its post-job save tars+uploads ~5GB that stalls the upload (~98.7%),
          # wedging the run. The persistent disk is the cache.
          cache: false
      - name: Check go.mod tidy
        if: needs.changes.outputs.code == 'true'
        # aphrollo-tools is pure stdlib (no go.sum). A clean worktree after
        # `go mod tidy` is the signal that go.mod has not drifted.
        run: |
          go mod tidy
          git diff --exit-code
      - if: needs.changes.outputs.code == 'true'
        run: go vet ./...
      # -race catches data races, -shuffle=on catches order-dependent tests,
      # -count=1 disables the test cache so a stale pass can't hide a regression.
      # The tdd package's real-git integration tests need `git` on PATH (the
      # runner has it) and inject a fake suite runner, so no live toolchain
      # is required.
      - name: Test (race + shuffle)
        if: needs.changes.outputs.code == 'true'
        run: go test -race -count=1 -shuffle=on -timeout=180s ./...

  lint:
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: self-hosted
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: on the self-hosted runner the Go module + build caches already
          # persist on $HOME between jobs, so setup-go's remote cache is redundant —
          # and its post-job save tars+uploads ~5GB that stalls the upload (~98.7%),
          # wedging the run. The persistent disk is the cache.
          cache: false
      - name: golangci-lint
        if: needs.changes.outputs.code == 'true'
        # per-run isolated cache — shared self-hosted golangci cache otherwise stale-locks / dead worktree paths → spurious lint failures
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-${{ github.run_id }}-${{ github.run_attempt }}
        # --allow-serial-runners: golangci-lint also takes a MACHINE-WIDE lock
        # ($TMPDIR/golangci-lint.lock, not under the cache dir above), so two Go
        # jobs sharing a self-hosted runner (two runners, nine repos) otherwise
        # collide — the loser waits 5s then exits 3 with "parallel golangci-lint
        # is running", a spurious red. This flag serializes on the lock instead
        # of failing; a burst queues, each run holds the lock only for its own
        # duration (flock, freed by the kernel even on crash).
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run --allow-serial-runners ./...

  # The performance ratchet for the three Tier-1 benchmarks: `ratchet check`
  # cold and warm, and the pre-edit judge over a generated 41-package,
  # ~10000-file fixture (see internal/ratchet/check_bench_test.go and
  # internal/tdd/ratchetgate_bench_test.go). benchstat compares this run
  # against testdata/bench/baseline.txt; a >20% regression on ANY metric
  # (sec/op, B/op, allocs/op) fails the job. The baseline file is only ever
  # LOWERED, by hand, after a real improvement is measured here — never
  # raised to make a slow change pass.
  benchmarks:
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: self-hosted
    # Measured generating testdata/bench/baseline.txt on a Windows dev box:
    # BenchmarkRatchetCheckCold's fixture build + ~45s/iter bench dominates —
    # six reps of the whole ratchet package took 1375s there. -count=3 here
    # trades some of the baseline's statistical power for a job that fits a
    # PR's budget; benchstat compares samples of different size fine.
    timeout-minutes: 25
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run the benchmarks
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          # set -e alone lets `go test ... | tee new-bench.txt` pass with
          # tee's own exit 0 even when `go test` itself failed to build or
          # panicked — pipefail is what makes the LEFT side of that pipe's
          # exit code the step's own, so a build failure stops here instead
          # of feeding a truncated/absent new-bench.txt into benchstat as if
          # it were a clean, comparable run.
          set -euo pipefail
          # -cpu=1 pins GOMAXPROCS, which Go stamps onto every benchmark NAME
          # ("RatchetCheckCold-24" vs "-8") — but Go OMITS the suffix
          # entirely when procs is 1 ("RatchetCheckCold", no "-N" at all).
          # testdata/bench/baseline.txt is recorded the same way, so a run on
          # any runner produces the exact same names benchstat groups by.
          go test ./internal/ratchet/... ./internal/tdd/... -run=NONE \
            -bench '^(BenchmarkRatchetCheckCold|BenchmarkRatchetCheckWarm|BenchmarkPreEditJudge)$' \
            -benchmem -cpu=1 -count=3 -timeout=20m | tee new-bench.txt
      - name: Install benchstat
        if: needs.changes.outputs.code == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70
      - name: Compare against the baseline, fail on a >20% regression
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          # benchstat groups by the FULL config (goos/goarch/cpu lines
          # included), so the baseline recorded on a developer's box and a
          # run on this Linux runner would never land in the same group and
          # print with no "vs base" column at all — silently comparing
          # nothing. Stripping those lines is what makes the comparison
          # cross-machine; testdata/bench/baseline.txt is checked in without
          # them for the same reason.
          grep -v '^goos:\|^goarch:\|^cpu:' new-bench.txt > new-bench-nohdr.txt
          benchstat testdata/bench/baseline.txt new-bench-nohdr.txt | tee compare.txt
          # A renamed benchmark, a suffix mismatch, or a package that ran but
          # produced no matching rows all show up as benchstat's OWN "the
          # benchmark set differs from baseline" note and a "?" where a
          # percentage belongs — not as "no regression", as "nothing was
          # actually compared". That must fail loudly: a silently-empty
          # comparison is the one failure mode this whole job exists to
          # rule out.
          if grep -q 'benchmark set differs from baseline' compare.txt; then
            echo "::error::benchmark set differs from testdata/bench/baseline.txt — benchstat could not compare like-for-like (a renamed/missing benchmark?); see compare.txt above"
            exit 1
          fi
          # sec/op is wall-clock, informational only here: the baseline was
          # RECORDED on a developer's box, not this runner, so an absolute
          # timing delta between the two machines is not a code regression.
          # B/op and allocs/op are the algorithm's own footprint — the same
          # on any machine — so those two are the actual gate. `|| true` is
          # only on this grep: no match is the common (no-regression) case,
          # and grep's own exit 1 for "nothing found" must not read as this
          # STEP failing under `pipefail` before the threshold below runs.
          worst=$(awk 'BEGIN{RS=""; ORS="\n\n"} !/sec\/op/' compare.txt \
            | grep -oE '\+[0-9]+\.[0-9]+%' | tr -d '+%' | sort -rg | head -1 || true)
          if [ -n "${worst:-}" ] && awk -v w="$worst" 'BEGIN{exit !(w>=20)}'; then
            echo "::error::benchmark regressed by ${worst}% (B/op or allocs/op), over the 20% budget — see compare.txt above"
            exit 1
          fi
      - name: Upload the comparison
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchstat-comparison
          path: |
            new-bench.txt
            compare.txt
          if-no-files-found: warn

  # The mutation proof, measured where a mutant is affordable. gremlins judges
  # a mutant by re-running its WHOLE package, so the unit of cost is a package
  # suite: 26 s for internal/tdd here against 207 s on a Windows developer box,
  # times the 1626 mutants the analysis pass finds in that one package. That is
  # why this repo sets `mutants-local = false` in aphrollo.toml — the local
  # post-commit run stays for Cargo repos, and this one measures here.
  #
  # Scoped to the PR's own diff for the same reason: the whole module is not a
  # number anybody can wait for. The accept-list is aphrollo.toml's
  # [aphrollo] mutation-accept, and an entry without a stated reason is not an
  # accepted survivor — an unaccepted one fails the check.
  #
  # The CLI is built from THIS PR rather than taken from /usr/local/bin, so a
  # change to the runner is judged by the runner the PR proposes.
  #
  # It runs AFTER `test` rather than beside it. gremlins gathers coverage by
  # running the whole module's suite, so a concurrent `mutants` and `test` are
  # two runs of the same tests on one box — and internal/workspace's tests write
  # the runner's shared global git config, which collides: measured on the first
  # run of this job, both jobs went red with "could not lock config file
  # /home/github-runner/.config/git/aphrollo-runtime.cfg: File exists". The
  # dependency is the cheap fix; isolating those tests' git config is the real
  # one and belongs to internal/workspace.
  mutants:
    # Pushes to main only: the merge was judged locally under the pre-merge gate,
    # which consumed the lane's own signed receipt. This run is the tripwire; a red
    # here records an escape instead of blocking anyone.
    if: github.event_name == 'push'
    needs: [changes, test]
    runs-on: self-hosted
    # Sized from the measurement, not from a round number: 21 mutants over this
    # lane's own diff took 3m22s end to end, ~7 s per mutant plus one coverage
    # pass. 30 minutes is ~250 mutants, far past any diff a reviewable PR
    # carries -- and a run that has been going that long is one nobody is
    # waiting for, holding a serial self-hosted runner the whole time.
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the merge base has to exist locally to scope the diff
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: see the note in `test` -- the persistent disk is the cache.
          cache: false
      - name: Install gremlins
        if: needs.changes.outputs.code == 'true'
        # The tool was chosen by measurement, not argument: go-mutesting does
        # not build on this box, gremlins does and takes the three flags this
        # design needs (--diff, --output, --workers). See internal/tdd/mutants_go.go.
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Build the CLI from this PR
        if: needs.changes.outputs.code == 'true'
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      # The outcome store carries measurements across PUSHES on the same PR
      # (issue #143): keyed on the head branch, with the run id making every
      # save a NEW cache entry (a key already in the cache namespace cannot
      # be overwritten) and restore-keys picking up the most recent one for
      # this branch. Without this a one-file fix-round push re-measured the
      # WHOLE diff every time: six pushes on PR 138 cost six full ~10-minute
      # runs on this serial runner.
      - name: Cache the mutation outcome store
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutants-store
          key: mutants-store-${{ github.head_ref }}-${{ github.run_id }}
          restore-keys: |
            mutants-store-${{ github.head_ref }}-
      - name: aphrollo gate mutants go --diff
        if: needs.changes.outputs.code == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          ref="$BASE_SHA"
          if [ -z "$ref" ] || ! git rev-parse --verify --quiet "$ref^{commit}" >/dev/null; then
            ref=$(git rev-parse --verify --quiet "HEAD~1^{commit}" || true)
          fi
          if [ -z "$ref" ]; then echo "no diff base to scope the mutation run to" >&2; exit 1; fi
          base=$(git merge-base "$ref" HEAD)
          echo "scoping the run to $base..HEAD"
          ./bin/aphrollo gate mutants go --diff "$base" --receipt mutation-receipt.json --store .mutants-store
      - name: Upload the receipt
        # always(): the receipt of a run that FAILED is the one somebody needs
        # to read, and it is written before the check decides.
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-receipt
          path: mutation-receipt.json
          if-no-files-found: warn

  # The escape loop's closing half. `verify-closure` refuses a PR that says it
  # closes a labelled escape issue without changing a CHECK -- a law, a gate
  # stage, the workspace's gate metadata, or a test the issue named. It is NOT
  # gated on the `changes` filter: a docs-only PR is exactly the one that must
  # be refused when it claims to close an escape. A PR that closes no escape
  # issue prints one line and exits 0.
  #
  # The CLI is built from THIS PR rather than taken from /usr/local/bin, so a
  # change to the rule is judged by the rule the PR proposes.
  escape-closure:
    # A push carries no PR number, and `verify-closure` with an empty one fails
    # with `no pull requests found for branch "main"`. The check is about a pull
    # request, so it says so rather than running and failing on every merge.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: self-hosted
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: see the note in `test` -- the persistent disk is the cache.
          cache: false
      - name: Build the CLI from this PR
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: aphrollo gate escape verify-closure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./bin/aphrollo gate escape verify-closure "$PR_NUMBER"

  # The escape loop's OPENING half, and the only trigger that lives off this
  # box. A red here after a green local gate is the loop's sharpest evidence:
  # two runs of the same checks over the same tree disagreed.
  #
  # The runner has never seen the local gate's state, so the fact travels as a
  # GIT NOTE: `refs/notes/gate` holds `green <tree>` for a commit whose
  # pre-commit gate actually ran a suite and it passed, written by the
  # post-commit hook and pushed by the git shim. That is the whole channel --
  # smaller than a PR body (a human writes it and can edit it afterwards) and
  # smaller than a check-run annotation (an API call plus checks:write), and
  # it stays out of the commit message, which says what the change does and
  # nothing else. Notes are not fetched by default, hence the explicit fetch.
  # `gate escape record --from-ci` records NOTHING when the note is absent: a
  # red on a tip nobody gated says the gate never ran, not that it missed
  # something.
  #
  # It checks out the PR HEAD rather than the default merge ref, because the
  # merge commit is GitHub's and carries no note.
  #
  # `issues: write` is not granted to a workflow running on a PR from a FORK,
  # so the job would fail on the create rather than record anything; it is
  # skipped there and the miss is picked up by `gate escape sync` on the box
  # that owns the lane.
  escape-record:
    needs: [test, lint, vulncheck, sast, secret-scan, mutants]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.fork != true)) && contains(needs.*.result, 'failure') }}
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch the gate notes
        env:
          GH_TOKEN: ${{ github.token }}
        # Best effort: a repo whose remote has no notes ref yet is the common
        # case, and the recorder's own "no green gate note" answer is the
        # right one there.
        run: git fetch --no-tags origin "+refs/notes/gate:refs/notes/gate" || true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: see the note in `test` -- the persistent disk is the cache.
          cache: false
      - name: Build the CLI from this PR
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: aphrollo gate escape record
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The evidence is the FAILING JOBS' OWN LOG, not the job names: the
        # recorder fingerprints on the failing test names it can parse out of
        # it, and job names alone collide across every PR that fails `test`.
        # The run URL goes last, because a per-run value near the top would
        # make every re-run look like a new miss.
        #
        # The dedupe store is this box's gate-state, which a runner may not
        # have; the recorder therefore asks GitHub whether an open issue
        # already carries this fingerprint before creating one.
        run: |
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries|map(select(.value.result=="failure"))|map(.key)|sort|join(", ")')
          gh run view "$GITHUB_RUN_ID" --log-failed > failed.log 2>/dev/null || true
          ./bin/aphrollo gate escape record \
            "$failed failed on a tip the local gate passed" \
            --from-ci "pipeline: $failed" \
            --evidence "$(head -c 8000 failed.log)
          run: $RUN_URL"
  vulncheck:
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: self-hosted
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: on the self-hosted runner the Go module + build caches already
          # persist on $HOME between jobs, so setup-go's remote cache is redundant —
          # and its post-job save tars+uploads ~5GB that stalls the upload (~98.7%),
          # wedging the run. The persistent disk is the cache.
          cache: false
      - if: needs.changes.outputs.code == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - if: needs.changes.outputs.code == 'true'
        run: govulncheck ./...

  sast:
    if: github.event.pull_request.draft != true
    needs: changes
    runs-on: self-hosted
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Opengrep
        if: needs.changes.outputs.code == 'true'
        # Replaces the fragile `curl install.sh | bash` with a SHA-pinned binary download.
        env:
          OPENGREP_VERSION: v1.21.0
          OPENGREP_SHA256: 9ed0ceee4a3a406d27d40894bcce85ea151be21e6d4b180689689224faff2a3e
        run: |
          set -euo pipefail
          DEST="$HOME/.opengrep/cli/${OPENGREP_VERSION}"
          mkdir -p "$DEST"
          if [ ! -x "$DEST/opengrep" ]; then
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86" \
              -o "$DEST/opengrep.tmp"
            echo "${OPENGREP_SHA256}  $DEST/opengrep.tmp" | sha256sum -c -
            chmod +x "$DEST/opengrep.tmp"
            mv "$DEST/opengrep.tmp" "$DEST/opengrep"
          fi
          # Verify on every run, not just first download — a binary pre-planted
          # on the persistent self-hosted-runner $HOME would otherwise run unverified.
          echo "${OPENGREP_SHA256}  $DEST/opengrep" | sha256sum -c -
          ln -sfn "$DEST" "$HOME/.opengrep/cli/latest"
      - name: Opengrep scan
        if: needs.changes.outputs.code == 'true'
        run: |
          ~/.opengrep/cli/latest/opengrep scan \
            --config p/golang \
            --severity ERROR \
            --no-rewrite-rule-ids \
            .

  secret-scan:
    if: github.event.pull_request.draft != true
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gitleaks
          key: gitleaks-8.30.1-linux-x64
      - name: Download gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
      - name: gitleaks
        run: ./gitleaks detect --no-banner --redact -v --exit-code 1

  # PR deploy-readiness: prove the binary compiles + runs with the same flags
  # the deploy uses, so a broken build can't merge. Does NOT install (PR-only).
  build:
    if: github.event.pull_request.draft != true
    needs: [changes, test, lint, vulncheck, sast, secret-scan]
    runs-on: self-hosted
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: on the self-hosted runner the Go module + build caches already
          # persist on $HOME between jobs, so setup-go's remote cache is redundant —
          # and its post-job save tars+uploads ~5GB that stalls the upload (~98.7%),
          # wedging the run. The persistent disk is the cache.
          cache: false
      - name: Build aphrollo CLI
        if: needs.changes.outputs.code == 'true'
        run: go build -trimpath -buildvcs=false -o bin/aphrollo ./cmd/aphrollo
      - name: Smoke the binary
        if: needs.changes.outputs.code == 'true'
        run: ./bin/aphrollo tdd --help >/dev/null && ./bin/aphrollo --help >/dev/null

  # On merge to main (and manual dispatch), build + install /usr/local/bin/aphrollo.
  # Checks are skipped on push, so this uses the same always()+needs-result guard
  # as aphrollo-api: run after a green-PR merge, but a red required check that
  # blocked the merge means this never fires. A manual workflow_dispatch stays
  # gated behind the same guard.
  deploy:
    needs: [test, lint, vulncheck, sast, secret-scan]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: self-hosted
    timeout-minutes: 10
    concurrency:
      group: deploy-prod-aphrollo-cli
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: on the self-hosted runner the Go module + build caches already
          # persist on $HOME between jobs, so setup-go's remote cache is redundant —
          # and its post-job save tars+uploads ~5GB that stalls the upload (~98.7%),
          # wedging the run. The persistent disk is the cache.
          cache: false
      - name: Build
        run: go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/aphrollo ./cmd/aphrollo
      - name: Deploy
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./deploy/deploy-prod.sh
