name: Deploy

# Installs /usr/local/bin/aphrollo on the production host: builds the newest
# release tag and runs deploy/deploy-prod.sh (see deploy/README.md). Dispatched
# by the pipeline's `release` job, which runs only after test, lint, scan and
# workflow-pins passed for the commit, so this file carries no checks of its
# own. It is a separate workflow so the one self-hosted runner being down never
# holds a pipeline run open. A newer dispatch supersedes a queued one: the job
# builds the newest tag either way, so the newest request is the only one
# worth running.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Only a dispatch of main can schedule this onto the host; a
    # pull_request event never satisfies the guard.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The box runs the newest release tag, not the commit that triggered this
      # run: a merge that does not bump VERSION redeploys the tag it already ran.
      - name: Check out the newest release tag
        id: tag
        run: |
          tag=$(bash deploy/newest-tag.sh)
          git checkout --detach "$tag"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # false: on the self-hosted runner the Go module + build caches already
          # persist on $HOME between jobs, so setup-go's remote cache is redundant —
          # and its post-job save tars+uploads ~5GB that stalls the upload (~98.7%),
          # wedging the run. The persistent disk is the cache.
          cache: false
      # The -X stamps are the ones `aphrollo update` sets (selfinstall.go's
      # buildArgs): without them `aphrollo version` prints unstamped and the
      # hourly behind-origin/main check has nothing to compare, so this box
      # would never notice a stale binary.
      - name: Build
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/aphrollo/aphrollo-tools/internal/buildinfo.commit=${{ steps.tag.outputs.sha }} -X github.com/aphrollo/aphrollo-tools/internal/buildinfo.builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o bin/aphrollo ./cmd/aphrollo
      - name: Deploy
        env:
          GITHUB_SHA: ${{ steps.tag.outputs.sha }}
        run: ./deploy/deploy-prod.sh
