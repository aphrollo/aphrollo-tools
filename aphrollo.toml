# aphrollo's own gate configuration. A Cargo workspace declares this in
# [workspace.metadata.aphrollo]; a repo with no Cargo.toml declares it here.

[aphrollo]
# A lane merges on a mutation proof, not on a green suite alone. Read by
# mutationReceiptStage, which stands down here because of the next key --
# see it for who does the judging instead.
mutation-receipt = true

# ...and the proof is NOT measured by the post-commit hook on this box, because
# gremlins cannot measure this module on Windows. `gremlins unleash --dry-run`
# there reports `Runnable: 0, Not covered: 4890, Mutator coverage: 0.00%`: Go's
# coverage profile comes back empty, every mutant is filed NOT COVERED, and the
# receipt that lands says every mutant survived. A dogfood lane measured 50
# mutants / 0 caught / 50 survivors on Windows against 50 / 44 caught for the
# same tree on Linux. That receipt is not merely useless, it is wrong in the
# direction that blocks merges, and producing it costs a full mutation run of
# CPU plus a console window per git the suite spawns.
#
# So the run is deliberately off here and the receipt is earned on Linux
# instead -- see docs/mutation-runner.md for the route. Set this back to true
# on a box whose gremlins reports a non-zero mutator coverage.
mutants-local = false

# ...but the receipt is still JUDGED here. The Linux clone that measures it
# shares this machine's CLAUDE_CONFIG_DIR, so it signs with the same key and
# the pre-merge gate can both find and verify what it wrote. Without this key
# the gate reads `mutants-local = false` as "CI judges it" and stands down --
# which, on a repo whose CI does not judge it, means every lane merges on no
# proof at all.
mutants-judge-local = true

# Survivors somebody signed off on: "<file>:<line> <MUTATOR> # why". The
# reason is not decoration — an entry without one is not an accepted survivor,
# and the CI check goes red for it. Empty is the state to keep it in.
mutation-accept = [
  "internal/ratchet/preset.go:65 CONDITIONALS_NEGATION # comparator is a no-op on embed.FS's already-sorted ReadDir output",
  "internal/ratchet/preset.go:66 CONDITIONALS_BOUNDARY # comparator is a no-op on embed.FS's already-sorted ReadDir output",
  "internal/ratchet/preset.go:66 CONDITIONALS_NEGATION # comparator is a no-op on embed.FS's already-sorted ReadDir output",
  "internal/ratchet/preset.go:68 CONDITIONALS_BOUNDARY # comparator is a no-op on embed.FS's already-sorted ReadDir output",
  "internal/ratchet/preset.go:68 CONDITIONALS_NEGATION # comparator is a no-op on embed.FS's already-sorted ReadDir output",
  "internal/ratchet/preset.go:121 ARITHMETIC_BASE # capacity hint only, never observable in the appended slice's length or contents",
  "internal/ratchet/check.go:196 CONDITIONALS_BOUNDARY # loop body is a no-op on an empty sets map regardless of which side of the boundary lets it run",
  "internal/tdd/escape.go:296 CONDITIONALS_BOUNDARY # start indexes the opening bracket and end indexes the closing one in the same string; distinct byte values can never share one position, so end == start is unreachable whenever both are found, and when either is -1 the first disjunct already decides — proven equivalent by hand-mutating end < start to end <= start and rerunning TestSyncEscapes*/TestClosedIssueNumbers* locally: same green, no test distinguishes them",
  "internal/tdd/session.go:264 ARITHMETIC_BASE # the mutated operator sits between two string literals in a const declaration; every arithmetic substitute for + is undefined on strings and fails to compile (verified by hand: 'invalid operation: operator - not defined on ... (untyped string constant)') — not a behavioural gap, a build failure gremlins counted as a survivor",
  "internal/tdd/mutants_go.go:49 CONDITIONALS_BOUNDARY # clamping workers up to a floor of 1 (`workers < 1`) versus `workers <= 1` differ only when workers == 1: the branch fires either way and reassigns workers = 1, a no-op at that value, so gremlinsArgv's output is identical for every integer input — proven equivalent by hand-mutating < to <= and rerunning the full internal/tdd and internal/cli suites locally: same green, no test distinguishes them",
  "internal/diff/unified.go:110 ARITHMETIC_BASE # len(ops)+1 is only a capacity hint for the split slice; the split branch is reachable only with len(ops) >= 1 (the len(ops) == 0 case already returned earlier), so len(ops)-1 never goes negative and make() never panics — the resulting slice's length and contents are identical either way since append grows past a too-small capacity automatically, proven equivalent by hand-mutating +1 to -1 and rerunning the internal/diff suite locally: same green, no test distinguishes them",
  "internal/cli/gitnotes.go:109 INCREMENT_DECREMENT # the mutated `i++` is pushRemote's skip over a push flag's VALUE inside a `for i := 0; i < len(args); i++` loop; decrementing it there cancels the loop's own increment, so any argv containing a push-value flag makes the index oscillate and the function never returns. A function that does not return has no value for a test to assert and no message for one to match: the only observable is the absence of progress, which the runner reports as TIMED OUT rather than as a result, so no test can turn it into a kill — verified by hand-mutating i++ to i-- and running `go test ./internal/cli -run Push -timeout 25s`, which reported `panic: test timed out after 25s` instead of a failing assertion; the file was restored byte-identically"
  "internal/workspace/push.go:45 ARITHMETIC_BASE # the mutated operator sits between the \"origin/\" string literal and the branch string in resolveAhead's fallback ref; every arithmetic substitute for + (- * / %) is undefined on Go strings and fails to compile (verified by hand: 'invalid operation: operator - not defined on \"origin/\" (constant of type string)') — not a behavioural gap, a build failure gremlins counted as a survivor",
  "internal/tdd/mechcache.go:248 CONDITIONALS_BOUNDARY # splitNulPaths only reaches `n := len(fields)` after an early return on s == \"\", and strings.Split of a non-empty string always yields len(fields) >= 1, so n is never 0 at this line: `n > 0` and `n >= 0` hold for every reachable n and the trim condition's truth value is identical either way — proven equivalent by hand-mutating > to >= and rerunning the full internal/tdd suite locally: same green, no test distinguishes them",
  "internal/tdd/gc_render.go:42 CONDITIONALS_BOUNDARY # `if len(c.Path) > width { width = len(c.Path) }` is a running-max scan: switching to `>=` only additionally fires when len(c.Path) == width, and the assignment then sets width to the value it already holds, a no-op. The final width — and therefore every padded column RenderGC prints — is identical for every candidate slice under either operator — proven equivalent by hand-mutating > to >= and rerunning the full internal/tdd suite locally: same green, no test distinguishes them",
  "internal/tdd/precommit_failfirst.go:56 INCREMENT_DECREMENT # the mutated `i++` is cargoPackagesInArgs' skip over a flag's VALUE inside a `for i := 0; i+1 < len(args); i++` loop; decrementing it cancels the loop's own increment, so any argv naming a package makes the index oscillate and the function never returns. There is no value to assert and no message to match -- the only observable is the absence of progress, which the runner reports as TIMED OUT rather than as a result. Same shape as the accepted entries for gitOperands and pushRemote"
  "internal/tdd/precommit_failfirst.go:142 CONDITIONALS_NEGATION # pre-existing line, moved into this file unchanged by the split of precommit.go and re-mutated only because the Go runner does not track moved lines (issue #208); `git show main:internal/tdd/precommit.go` carries the identical `if runner.Cmd == \"cargo\"` guard. Untested before the move and untested after it: real debt, owned by the fail-first stage, not introduced here"
  "internal/tdd/precommit_failfirst.go:144 CONDITIONALS_NEGATION # the `if profileWs == \"\"` fallback on the same moved block, same argument as :142 -- unchanged by the split, re-mutated only because moved lines are not tracked (issue #208)"
]
